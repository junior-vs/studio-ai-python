[project]
name = "app"
version = "0.1.0"
description = "A Python project with CLI and REST API interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "click>=8.1.7",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "langgraph", 
    "langchain", 
    "langchain-openai", 
    "langchain-community", 
    "python-dotenv", 
    "faiss-cpu", 
    "langchain >= 1.1.0",
    "langchain-core >= 1.1.0",
    "requests >= 2.32.5",
    "requests-toolbelt >= 1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
app-cli = "app.cli.main:cli"
app-api = "app.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


